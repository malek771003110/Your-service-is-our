<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفضلتي المحفوظة ❤️ | منصة خدمتك 🇯🇴</title>
    
    <!-- Fonts & Core Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .fav-page-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 15px 60px;
        }

        .fav-header-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow-glass);
            position: relative;
        }

        .fav-icon-bubble {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.4);
            animation: heartBeat 2s infinite;
        }

        .fav-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-pure);
            margin-bottom: 6px;
        }

        .fav-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .fav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .fav-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow-card);
            position: relative;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .fav-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-focus);
            box-shadow: var(--shadow-glass);
        }

        .fav-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 15px;
        }

        .fav-avatar-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--grad-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            flex-shrink: 0;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .fav-card-info h3 {
            font-size: 17px;
            font-weight: 900;
            color: var(--text-pure);
            margin-bottom: 4px;
        }

        .fav-card-job {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 2px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
        }

        .fav-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .fav-card-actions {
            display: flex;
            gap: 8px;
        }

        .fav-btn-action {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
            border: none;
        }

        .fav-btn-action.remove {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fb7185;
            flex: 0 0 44px;
        }

        .fav-btn-action.remove:hover {
            background: rgba(244, 63, 94, 0.3);
        }

        .fav-btn-action.contact {
            background: var(--grad-emerald);
            color: #0b091a;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .fav-btn-action.contact:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        .empty-fav-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 60px 20px;
            text-align: center;
            grid-column: 1 / -1;
            box-shadow: var(--shadow-glass);
        }

        .top-back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--bg-glass-heavy);
            border: 1px solid var(--border-color);
            color: var(--text-pure);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .top-back-btn:hover {
            background: var(--grad-primary);
            border-color: transparent;
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .fav-grid {
                grid-template-columns: 1fr;
            }
            .top-back-btn {
                top: 10px;
                right: 10px;
                font-size: 12px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="top-back-btn">
        <span>←</span>
        <span>العودة للرئيسية</span>
    </a>

    <div class="fav-page-layout">
        <div class="fav-header-card">
            <div class="fav-icon-bubble">❤️</div>
            <h1 class="fav-title">مفضلتي المحفوظة</h1>
            <p class="fav-subtitle">قائمة المهنيين المفضلين الذين قمت بحفظهم للوصول السريع والتواصل المباشر</p>
        </div>

        <div id="loadingState" style="text-align: center; padding: 50px;">
            <div class="loading-spinner" style="margin: 0 auto 12px;"></div>
            <p style="color: var(--text-secondary); font-weight: 700;">جاري تحميل قائمتك المفضلة...</p>
        </div>

        <div class="fav-grid" id="favoritesGrid" style="display: none;"></div>

        <div class="empty-fav-card" id="emptyState" style="display: none;">
            <div style="font-size: 50px; margin-bottom: 12px;">💔</div>
            <h2 style="color: var(--text-pure); font-size: 20px; font-weight: 900; margin-bottom: 8px;">لا توجد مفضلات محفوظة بعد</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 25px;">
                يمكنك الضغط على علامة القلب ❤️ في كروت المهنيين بالصفحة الرئيسية لحفظهم هنا.
            </p>
            <a href="index.html" class="btn-nav-register" style="display: inline-flex; padding: 12px 30px; font-size: 14px;">
                🔍 تصفح دليل المهنيين الآن
            </a>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="custom-toast" id="toastBox"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            deleteDoc,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCj5YjdiruBTCfxDnxlDd4W6YA5iCWRfE4",
            authDomain: "home-services-app-a9c5e.firebaseapp.com",
            projectId: "home-services-app-a9c5e",
            storageBucket: "home-services-app-a9c5e.appspot.com",
            messagingSenderId: "287028219636",
            appId: "1:287028219636:web:2ad4b0e092a2c007e318a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let favorites = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const isLoggedIn = localStorage.getItem('customerLoggedIn');
            const customerEmail = localStorage.getItem('customerEmail');

            if (isLoggedIn !== 'true' || !customerEmail) {
                alert('⚠️ يرجى تسجيل الدخول للوصول إلى قائمتك المفضلة');
                window.location.href = 'customer-auth-page.html';
                return;
            }

            await loadFavorites(customerEmail);
        });

        async function loadFavorites(customerEmail) {
            const loading = document.getElementById('loadingState');
            const grid = document.getElementById('favoritesGrid');
            const empty = document.getElementById('emptyState');

            try {
                const q = query(
                    collection(db, "favorites"),
                    where("customerEmail", "==", customerEmail)
                );

                const snapshot = await getDocs(q);
                favorites = [];

                snapshot.forEach((d) => {
                    favorites.push({ id: d.id, ...d.data() });
                });

                loading.style.display = 'none';

                if (favorites.length === 0) {
                    empty.style.display = 'block';
                    grid.style.display = 'none';
                    return;
                }

                empty.style.display = 'none';
                grid.style.display = 'grid';
                grid.innerHTML = '';

                favorites.forEach((fav) => {
                    const card = createFavCard(fav);
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error("Favorites error:", err);
                loading.innerHTML = '<p style="color: var(--error);">حدث خطأ أثناء تحميل المفضلة.</p>';
            }
        }

        function createFavCard(fav) {
            const card = document.createElement('div');
            card.className = 'fav-card';

            const firstLetter = (fav.professionalName || 'م').charAt(0).toUpperCase();
            const phone = fav.professionalPhone || '';
            const cleanPhone = phone.replace(/[^0-9]/g, '');

            card.innerHTML = `
                <div>
                    <div class="fav-card-header">
                        <div class="fav-avatar-circle">${firstLetter}</div>
                        <div class="fav-card-info">
                            <h3>${fav.professionalName || 'مهني'}</h3>
                            <span class="fav-card-job">${fav.professionalJob || 'خدمات صيانة'}</span>
                        </div>
                    </div>

                    <div class="fav-card-meta">
                        <span>📍 ${fav.professionalCity || 'عمان'}</span>
                        <span>⭐ ${fav.rating ? fav.rating.toFixed(1) : '5.0'}</span>
                    </div>
                </div>

                <div class="fav-card-actions">
                    <button class="fav-btn-action remove" onclick="removeFavorite('${fav.id}', '${fav.professionalName}')" title="إزالة من المفضلة">
                        🗑️
                    </button>
                    ${phone ? `
                        <a href="https://wa.me/962${cleanPhone.startsWith('0') ? cleanPhone.slice(1) : cleanPhone}" target="_blank" class="fav-btn-action contact" style="background: rgba(37, 211, 102, 0.2); color: #4ade80; border: 1px solid rgba(37, 211, 102, 0.3);">
                            💬 واتساب
                        </a>
                        <a href="tel:${cleanPhone}" class="fav-btn-action contact">
                            📞 اتصال
                        </a>
                    ` : `
                        <a href="index.html" class="fav-btn-action contact">
                            🌐 عرض الملف
                        </a>
                    `}
                </div>
            `;

            return card;
        }

        window.removeFavorite = async function(favId, proName) {
            if (!confirm(`هل تريد إزالة المهني "${proName}" من قائمتك المفضلة؟`)) return;

            try {
                await deleteDoc(doc(db, "favorites", favId));
                favorites = favorites.filter(f => f.id !== favId);

                const grid = document.getElementById('favoritesGrid');
                const empty = document.getElementById('emptyState');

                if (favorites.length === 0) {
                    grid.style.display = 'none';
                    empty.style.display = 'block';
                } else {
                    grid.innerHTML = '';
                    favorites.forEach(f => grid.appendChild(createFavCard(f)));
                }

                showToast('💔 تمت الإزالة من المفضلة');
            } catch (err) {
                console.error("Remove fav error:", err);
                alert("حدث خطأ أثناء الإزالة");
            }
        };

        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
