<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بوابة الإدارة | تسجيل دخول المسؤول - منصة خدمتك 🇯🇴</title>
  
  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .admin-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-card {
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-glass);
      animation: modalPop 0.4s ease;
    }

    .admin-icon-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 15px;
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
    }

    .admin-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-pure);
      margin-bottom: 6px;
    }

    .admin-subtitle {
      color: var(--text-secondary);
      font-size: 13.5px;
      margin-bottom: 25px;
    }

    .input-wrapper-admin {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .admin-input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      background: rgba(10, 9, 28, 0.7);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-pure);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      transition: var(--transition);
      text-align: center;
      letter-spacing: 2px;
    }

    .admin-input:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.3);
    }

    .admin-eye-btn {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: var(--transition);
    }

    .admin-eye-btn:hover {
      color: var(--text-pure);
    }

    .remember-me-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0 20px;
      user-select: none;
    }

    .remember-me-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-checkbox-custom {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #ec4899;
      background: rgba(10, 9, 28, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      transition: var(--transition);
    }

    .remember-checkbox-custom.checked {
      background: #ec4899;
      font-weight: 900;
    }

    .admin-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }

    .admin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.6);
    }

    .alert-box {
      padding: 10px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      margin-top: 15px;
      display: none;
    }

    .alert-box.error {
      background: var(--error-bg);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      display: block;
    }

    .top-back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: var(--bg-glass-heavy);
      border: 1px solid var(--border-color);
      color: var(--text-pure);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: var(--transition);
    }

    .top-back-btn:hover {
      background: var(--grad-primary);
      border-color: transparent;
      color: white;
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="admin-body">
  <a href="index.html" class="top-back-btn">
    <span>←</span>
    <span>العودة للرئيسية</span>
  </a>

  <div class="admin-card">
    <div class="admin-icon-badge">🛡️</div>
    <h2 class="admin-title">لوحة تحكم الإدارة</h2>
    <p class="admin-subtitle">الوصول مقصور على المشرفين المعتمدين</p>

    <div class="input-wrapper-admin">
      <input type="password" id="adminPass" class="admin-input" placeholder="كلمة المرور السرية" autofocus />
      <button type="button" class="admin-eye-btn" onclick="toggleAdminPassVisibility()" title="إظهار / إخفاء">
        <span id="adminEyeIcon">👁️</span>
      </button>
    </div>

    <!-- 🔘 زر ذكرني -->
    <div class="remember-me-container">
      <div class="remember-me-label" onclick="toggleRememberAdmin()">
        <div class="remember-checkbox-custom" id="adminRememberCheckbox"></div>
        <span>ذكرني (حفظ تسجيل الدخول)</span>
      </div>
    </div>

    <button onclick="login()" id="loginBtn" class="admin-btn">🔓 دخول لوحة التحكم</button>
    <div class="alert-box error" id="errorMsg">كلمة المرور غير صحيحة.</div>
  </div>

  <script>
    let rememberAdmin = false;

    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('adminRememberSaved') === 'true') {
        rememberAdmin = true;
        const cb = document.getElementById('adminRememberCheckbox');
        cb.classList.add('checked');
        cb.textContent = '✓';
      }
      
      if (localStorage.getItem('adminLoggedIn') === 'true' || sessionStorage.getItem('adminLoggedIn') === 'true') {
        window.location.href = "requests.html";
      }
    });

    function toggleRememberAdmin() {
      rememberAdmin = !rememberAdmin;
      const cb = document.getElementById('adminRememberCheckbox');
      if (rememberAdmin) {
        cb.classList.add('checked');
        cb.textContent = '✓';
        localStorage.setItem('adminRememberSaved', 'true');
      } else {
        cb.classList.remove('checked');
        cb.textContent = '';
        localStorage.removeItem('adminRememberSaved');
      }
    }

    function toggleAdminPassVisibility() {
      const passInput = document.getElementById("adminPass");
      const eyeIcon = document.getElementById("adminEyeIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.textContent = "🙈";
      } else {
        passInput.type = "password";
        eyeIcon.textContent = "👁️";
      }
    }

    function login() {
      const pass = document.getElementById("adminPass").value.trim();
      const correctPassword = "himour908070";
      const loginBtn = document.getElementById("loginBtn");
      const errorMsg = document.getElementById("errorMsg");

      if (!pass) {
        showError("يرجى إدخال كلمة المرور");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "جاري التحقق...";
      errorMsg.style.display = "none";

      setTimeout(() => {
        if (pass === correctPassword) {
          sessionStorage.setItem("adminLoggedIn", "true");
          if (rememberAdmin) {
            localStorage.setItem("adminLoggedIn", "true");
          }
          loginBtn.textContent = "تم التحقق ✓";
          window.location.href = "requests.html";
        } else {
          showError("كلمة المرور غير صحيحة");
          loginBtn.disabled = false;
          loginBtn.textContent = "🔓 دخول لوحة التحكم";
        }
      }, 400);
    }

    function showError(message) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = message;
      errorMsg.style.display = "block";
    }

    document.getElementById("adminPass").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        login();
      }
    });
  </script>
</body>
</html>
