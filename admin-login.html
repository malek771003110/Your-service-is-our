<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png">

  <!-- Fonts & Core Stylesheet -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .admin-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.18), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.15), transparent 45%),
                  #070614;
    }

    .admin-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(99, 102, 241, 0.25);
      animation: modalPop 0.4s ease;
    }

    .admin-icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
      transition: all 0.3s ease;
    }

    .admin-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-pure);
      margin-bottom: 6px;
    }

    .admin-subtitle {
      color: var(--text-secondary);
      font-size: 13.5px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .field-group {
      text-align: right;
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrapper-admin {
      position: relative;
      display: flex;
      align-items: center;
    }

    .admin-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(10, 9, 28, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      color: var(--text-pure);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      transition: var(--transition);
      box-sizing: border-box;
      outline: none;
    }

    .admin-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
      background: rgba(10, 9, 28, 0.95);
    }

    /* 🔢 حقل كود الـ 2FA المميز */
    .twofa-input {
      letter-spacing: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      font-family: monospace;
      color: #38bdf8;
      border: 2px solid #6366f1;
      background: rgba(15, 23, 42, 0.9);
      padding: 14px 10px;
    }

    .admin-eye-btn {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: var(--transition);
    }

    .admin-eye-btn:hover {
      color: var(--text-pure);
    }

    .remember-me-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0 20px;
      user-select: none;
    }

    .remember-me-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-checkbox-custom {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #6366f1;
      background: rgba(10, 9, 28, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      transition: var(--transition);
    }

    .remember-checkbox-custom.checked {
      background: #6366f1;
      font-weight: 900;
    }

    .admin-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .admin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    .admin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-top: 10px;
      box-shadow: none;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: none;
    }

    .alert-box {
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      margin-top: 16px;
      display: none;
      line-height: 1.5;
    }

    .alert-box.error {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.35);

    .alert-box.success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);

    .alert-box.warning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);

    .top-back-btn {

      color: var(--text-pure);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: var(--transition);
      text-decoration: none;
    }

    .top-back-btn:hover {
      background: var(--grad-primary);
      border-color: transparent;
      color: white;
      transform: translateY(-2px);
    }

    .rate-limit-badge {
      display: inline-block;
      font-size: 11px;
      color: #94a3b8;
      margin-top: 14px;
    }
  </style>

<body class="admin-body">
  <a href="index.html" class="top-back-btn">
    <span>←</span>
    <span>العودة للرئيسية</span>
  </a>

  <div class="admin-card">
    <div class="admin-icon-badge" id="iconBadge">🛡️</div>
    <h2 class="admin-title" id="pageTitle">بوابة الإدارة الآمنة</h2>
    <p class="admin-subtitle" id="pageSubtitle">تسجيل دخول رسمي ومشفر عبر خوادم Google Firebase Auth</p>

    <!-- 🟢 الخطوة 1: البريد الإلكتروني وكلمة السر -->
    <div id="step1Section">
      <div class="field-group">
        <label class="field-label" for="adminEmail">البريد الإلكتروني المخصص للإدارة:</label>
        <div class="input-wrapper-admin">
          <input 
            type="email" 
            id="adminEmail" 
            class="admin-input" 
            placeholder="admin@khedmtek.com" 
            value="admin@khedmtek.com" 
            dir="ltr" 
            autocomplete="username"
          />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="adminPass">كلمة المرور السرية:</label>
        <div class="input-wrapper-admin">
          <input 
            type="password" 
            id="adminPass" 
            class="admin-input" 
            placeholder="أدخل كلمة المرور" 
            dir="ltr" 
            autocomplete="current-password"
          />
          <button type="button" class="admin-eye-btn" onclick="toggleAdminPassVisibility()" title="إظهار / إخفاء">
            <span id="adminEyeIcon">👁️</span>
          </button>
        </div>
      </div>

      <div class="remember-me-container">
        <div class="remember-me-label" onclick="toggleRememberAdmin()">
          <div class="remember-checkbox-custom" id="adminRememberCheckbox"></div>
          <span>تذكرني على هذا الجهاز</span>
        </div>
      </div>

      <button onclick="handleAdminAuth()" id="loginBtn" class="admin-btn">🔒 المتابعة للمصادقة</button>
    </div>

    <!-- 🔐 الخطوة 2: التحقق الثنائي (2FA Verification Step) -->
    <div id="step2Section" style="display: none;">
      <div class="field-group" style="text-align: center;">
        <label class="field-label" for="twoFaInput" style="text-align: center;">رمز التحقق الأمني المكون من 6 أرقام (2FA PIN):</label>
        <input 
          type="text" 
          id="twoFaInput" 
          class="admin-input twofa-input" 
          placeholder="••••••" 
          maxlength="6" 
          pattern="[0-9]*" 
          inputmode="numeric" 
          autocomplete="one-time-code"
          dir="ltr"
        />
        <div style="font-size: 11.5px; color: var(--text-muted); margin-top: 8px;">
          أدخل رمز المصادقة المخصص للمسؤول لتأكيد الهوية ومنع الوصول غير المصرح به
        </div>
      </div>

      <button onclick="verify2FaCode()" id="verify2FaBtn" class="admin-btn">✅ تأكيد الرمز ودخول اللوحة</button>
      <button onclick="cancel2FaStep()" class="admin-btn secondary-btn">إلغاء والعودة للخطوة الأولى</button>
    </div>
    
    <div class="alert-box" id="msgBox"></div>
    <div class="rate-limit-badge" id="rateLimitBadge">🛡️ نظام حماية Brute Force ومراقبة محاولات الدخول نشط</div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCj5YjdiruBTCfxDnxlDd4W6YA5iCWRfE4",
      authDomain: "home-services-app-a9c5e.firebaseapp.com",
      projectId: "home-services-app-a9c5e",
      storageBucket: "home-services-app-a9c5e.appspot.com",
      messagingSenderId: "287028219636",
      appId: "1:287028219636:web:2ad4b0e092a2c007e318a1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let rememberAdmin = true;
    let pendingAdminUser = null;
    let expectedAdmin2FaCode = "789012"; // رمز الأمان الافتراضي للمسؤول (يمكن تخصيصه من Firestore لكل مسؤول)

    // 🛡️ فحص حظر الـ Rate Limiting المخزن محلياً وعبر السيرفر
    function checkClientLockout() {
      const lockUntil = parseInt(localStorage.getItem("adminLockoutUntil") || "0", 10);
      const now = Date.now();
      if (lockUntil > now) {
        const remainingMin = Math.ceil((lockUntil - now) / (60 * 1000));
        showMessage(`⛔ تم حظر تسجيل الدخول مؤقتاً لتكرار المحاولات الخاطئة. انتظر ${remainingMin} دقيقة.`, "error");
        document.getElementById("loginBtn").disabled = true;
        return true;
      }
      return false;
    }

    function recordFailedAttempt() {
      const fails = parseInt(localStorage.getItem("adminFailedAttempts") || "0", 10) + 1;
      localStorage.setItem("adminFailedAttempts", fails.toString());

      if (fails >= 5) {
        const lockUntil = Date.now() + (15 * 60 * 1000); // حظر 15 دقيقة
        localStorage.setItem("adminLockoutUntil", lockUntil.toString());
        localStorage.removeItem("adminFailedAttempts");
        showMessage("⛔ تم حظر تسجيل الدخول لمدة 15 دقيقة بعد 5 محاولات خاطئة!", "error");
        document.getElementById("loginBtn").disabled = true;
      } else {
        showMessage(`كلمة المرور غير صحيحة. متبقي لك ${5 - fails} محاولات قبل الحظر المؤقت.`, "error");
      }
    }

    function resetFailedAttempts() {
      localStorage.removeItem("adminFailedAttempts");
      localStorage.removeItem("adminLockoutUntil");
    }

    // فحص الجلسة النشطة تلقائياً إذا كان قد أتم الـ 2FA مسبقاً
    onAuthStateChanged(auth, async (user) => {
      if (user && !checkClientLockout()) {
        try {
          const is2FaDone = sessionStorage.getItem("admin2FaVerified") === "true";
          const twoFaTime = parseInt(sessionStorage.getItem("admin2FaTimestamp") || "0", 10);
          const isSessionFresh = (Date.now() - twoFaTime) < (12 * 3600 * 1000);

          if (is2FaDone && isSessionFresh) {
            const adminDoc = await getDoc(doc(db, "admins", user.uid));
            if (adminDoc.exists()) {
              window.location.href = "requests.html";
            }
          }
        } catch (e) {
          console.log("Check auth notice:", e);
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      rememberAdmin = true;
      const cb = document.getElementById('adminRememberCheckbox');
      if (cb) {
        cb.classList.add('checked');
        cb.textContent = '✓';
      }
      checkClientLockout();
    });

    window.toggleRememberAdmin = function() {
      rememberAdmin = !rememberAdmin;
      const cb = document.getElementById('adminRememberCheckbox');
      if (rememberAdmin) {
        cb.classList.add('checked');
        cb.textContent = '✓';
      } else {
        cb.classList.remove('checked');
        cb.textContent = '';
      }
    };

    window.toggleAdminPassVisibility = function() {
      const passInput = document.getElementById("adminPass");
      const eyeIcon = document.getElementById("adminEyeIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.textContent = "🙈";
      } else {
        passInput.type = "password";
        eyeIcon.textContent = "👁️";
      }
    };

    // 🟢 تنفيذ الخطوة 1: التحقق من الإيميل وكلمة المرور
    window.handleAdminAuth = async function() {
      if (checkClientLockout()) return;

      const email = document.getElementById("adminEmail").value.trim().toLowerCase();
      const pass = document.getElementById("adminPass").value;
      const loginBtn = document.getElementById("loginBtn");
      const msgBox = document.getElementById("msgBox");

      msgBox.style.display = 'none';

      if (!email || !email.includes('@')) {
        showMessage("الرجاء إدخال بريد إلكتروني صحيح", "error");
        return;
      }

      if (!pass || pass.length < 6) {
        showMessage("كلمة المرور يجب ألا تقل عن 6 خانات", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "جاري التحقق الأمني...";

      try {
        await setPersistence(auth, browserLocalPersistence);

        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const user = cred.user;

        // 🛡️ التحقق الصارم من وجود الحساب في جدول المشرفين المعتمدين في Firestore
        const adminDoc = await getDoc(doc(db, "admins", user.uid));
        if (!adminDoc.exists()) {
          await signOut(auth);
          loginBtn.disabled = false;
          loginBtn.textContent = "🔒 المتابعة للمصادقة";
          recordFailedAttempt();
          showMessage("⛔ هذا الحساب غير مصرح له كمسؤول في قاعدة البيانات.", "error");
          return;
        }

        // إذا وجد كود 2FA مخصص للمسؤول في قاعدة البيانات يتم اعتماده، وإلا الكود المعتمد
        const adminData = adminDoc.data() || {};
        if (adminData.securityPin) {
          expectedAdmin2FaCode = adminData.securityPin.toString();
        }

        resetFailedAttempts();
        pendingAdminUser = user;

        //  الانتقال للخطوة 2 (المصادقة الثنائية 2FA)
        document.getElementById("step1Section").style.display = "none";
        document.getElementById("step2Section").style.display = "block";
        document.getElementById("pageTitle").textContent = "التحقق بخطوتين (2FA) 🔐";
        document.getElementById("pageSubtitle").textContent = "تم التحقق من كلمة المرور. أدخل رمز الأمان السداسي للدخول";
        document.getElementById("iconBadge").textContent = "🔑";
        showMessage("أدخل رمز الأمان للمتابعة", "warning");

        setTimeout(() => {
          const twoFaInp = document.getElementById("twoFaInput");
          if (twoFaInp) twoFaInp.focus();
        }, 200);

      } catch (err) {
        console.error("Auth error:", err);
        loginBtn.disabled = false;
        loginBtn.textContent = "🔒 المتابعة للمصادقة";

        recordFailedAttempt();
      }
    };

    // 🔐 خوارزمية فحص كود Microsoft Authenticator المباشرة (RFC 6238 TOTP)
    async function verifyTotpDirectly(inputCode, secret = 'MALEKBIGBOSSKHED') {
      try {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        let bits = '';
        for (let i = 0; i < secret.length; i++) {
          const val = alphabet.indexOf(secret[i].toUpperCase());
          if (val === -1) continue;
          bits += val.toString(2).padStart(5, '0');
        }
        const keyBytes = new Uint8Array(Math.floor(bits.length / 8));
        for (let i = 0; i < keyBytes.length; i++) {
          keyBytes[i] = parseInt(bits.substr(i * 8, 8), 2);
        }

        const epoch = Math.floor(Date.now() / 1000);
        const timeStep = Math.floor(epoch / 30);

        const cryptoKey = await window.crypto.subtle.importKey(
          "raw",
          keyBytes,
          { name: "HMAC", hash: { name: "SHA-1" } },
          false,
          ["sign"]
        );

        // فحص النافذة اللحظية الحالية والسابقة واللاحقة (لتفادي أي فارق زمني طفيف بين الساعة والهاتف)
        for (let offset of [0, -1, 1]) {
          const step = timeStep + offset;
          const timeBuffer = new ArrayBuffer(8);
          const timeView = new DataView(timeBuffer);
          timeView.setUint32(4, step, false);

          const signature = await window.crypto.subtle.sign("HMAC", cryptoKey, timeBuffer);
          const hmac = new Uint8Array(signature);
          const hmacOffset = hmac[hmac.length - 1] & 0x0f;

          const code = (
            ((hmac[hmacOffset] & 0x7f) << 24) |
            ((hmac[hmacOffset + 1] & 0xff) << 16) |
            ((hmac[hmacOffset + 2] & 0xff) << 8) |
            (hmac[hmacOffset + 3] & 0xff)
          ) % 1000000;

          if (code.toString().padStart(6, '0') === inputCode) {
            return true;
          }
        }
        return false;
      } catch (e) {
        console.warn("Direct TOTP calculation error:", e);
        return false;
      }
    }

    // 🔐 تنفيذ الخطوة 2: فحص كود التحقق الثنائي (2FA Verification)
    window.verify2FaCode = async function() {
      const codeInput = document.getElementById("twoFaInput").value.trim();
      const verifyBtn = document.getElementById("verify2FaBtn");

      if (!codeInput || codeInput.length < 4) {
        showMessage("الرجاء إدخال رمز الأمان كاملاً", "error");
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = "جاري مطابقة الرمز مع هاتفك...";

      let isSuccess = false;
      let responseMsg = "✅ مرحباً بك يا MALEK Big Boss! تم التحقق بنجاح وتأكيد هويتك كمسؤول معتمد.";

      // 1. الفحص الفوري المباشر لخوارزمية TOTP (RFC 6238) الخاصة بحساب MALEK Big Boss
      const isDirectTotpValid = await verifyTotpDirectly(codeInput);
      if (isDirectTotpValid) {
        isSuccess = true;
      }

      // 2. محاولة التحقق عبر السيرفر (سواء Netlify Function أو Node.js server)
      if (!isSuccess) {
        try {
          const verifyEndpoints = ['/api/admin/verify-2fa', '/.netlify/functions/verify-2fa'];
          for (const ep of verifyEndpoints) {
            try {
              const verifyRes = await fetch(ep, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  code: codeInput,
                  userUid: pendingAdminUser ? pendingAdminUser.uid : null
                })
              });
              if (verifyRes.ok) {
                const resData = await verifyRes.json();
                if (resData.success) {
                  isSuccess = true;
                  break;
                }
              }
            } catch (err) {}
          }
        } catch (netErr) {
          console.warn("Server 2FA check skipped:", netErr);
        }
      }

      // 3. الفحص الاحتياطي لرموز الأمان الثابتة والطوارئ
      if (!isSuccess) {
        if (codeInput === expectedAdmin2FaCode || codeInput === "789012" || codeInput === "202688") {
          isSuccess = true;
        }
      }

      if (isSuccess) {
        try {
          if (pendingAdminUser) {
            await setDoc(doc(db, "admins", pendingAdminUser.uid), {
              lastLogin: serverTimestamp(),
              last2FaVerifiedAt: serverTimestamp(),
              authorizedAccount: "MALEK Big Boss"
            }, { merge: true });
          }

          // تثبيت الجلسة الآمنة والمصادقة الثنائية في ذاكرة الجلسة
          sessionStorage.setItem("admin2FaVerified", "true");
          sessionStorage.setItem("admin2FaTimestamp", Date.now().toString());
          sessionStorage.setItem("adminLoggedIn", "true");
          localStorage.setItem("adminLoggedIn", "true");

          verifyBtn.textContent = "تم التحقق بنجاح ✓";
          showMessage(responseMsg, "success");

          setTimeout(() => {
            window.location.href = "requests.html";
          }, 600);
        } catch (e) {
          console.error("Save 2FA session error:", e);
          sessionStorage.setItem("admin2FaVerified", "true");
          sessionStorage.setItem("admin2FaTimestamp", Date.now().toString());
          window.location.href = "requests.html";
        }
      } else {
        verifyBtn.disabled = false;
        verifyBtn.textContent = "✅ تأكيد الرمز ودخول اللوحة";
        showMessage("❌ رمز الأمان غير صحيح أو انتهت صلاحيته! تأكد من الرمز اللحظي في تطبيق Authenticator بهاتفك.", "error");
      }
    };

    window.cancel2FaStep = async function() {
      try { await signOut(auth); } catch (e) {}
      pendingAdminUser = null;
      document.getElementById("step2Section").style.display = "none";
      document.getElementById("step1Section").style.display = "block";
      document.getElementById("pageTitle").textContent = "بوابة الإدارة الآمنة";
      document.getElementById("pageSubtitle").textContent = "تسجيل دخول رسمي ومشفر عبر خوادم Google Firebase Auth";
      document.getElementById("iconBadge").textContent = "🛡️";
      document.getElementById("loginBtn").disabled = false;
      document.getElementById("loginBtn").textContent = "🔒 المتابعة للمصادقة";
      document.getElementById("twoFaInput").value = "";
      document.getElementById("msgBox").style.display = "none";
    };

    function showMessage(text, type) {
      const msgBox = document.getElementById("msgBox");
      msgBox.className = `alert-box ${type}`;
      msgBox.textContent = text;
      msgBox.style.display = "block";
    }

    document.getElementById("adminPass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") window.handleAdminAuth();
    });

    document.getElementById("adminEmail").addEventListener("keypress", (e) => {
      if (e.key === "Enter") window.handleAdminAuth();
    });

    document.getElementById("twoFaInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") window.verify2FaCode();
    });
  </script>
</body>
</html>
