<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة المهنيين | تسجيل الدخول - منصة خدمتك 🇯🇴</title>
  
  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .auth-page-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 15px;
      position: relative;
    }

    .login-card-pro {
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 40px 35px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-glass);
      position: relative;
      z-index: 10;
      animation: modalPop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-section {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon-pro {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      margin: 0 auto 15px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 900;
      color: var(--text-pure);
      margin-bottom: 6px;
    }

    .welcome-subtitle {
      color: var(--text-secondary);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon {
      position: absolute;
      right: 16px;
      color: var(--accent-amber);
      font-size: 16px;
      pointer-events: none;
    }

    .input-wrapper .form-input {
      width: 100%;
      padding: 14px 46px 14px 44px;
      background: rgba(10, 9, 28, 0.7);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-pure);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: var(--transition);
    }

    .input-wrapper .form-input:focus {
      outline: none;
      border-color: var(--accent-amber);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
      background: rgba(10, 9, 28, 0.9);
    }

    .password-toggle-btn {
      position: absolute;
      left: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: var(--transition);
    }

    .password-toggle-btn:hover {
      color: var(--text-pure);
    }

    .remember-me-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0 20px;
      user-select: none;
    }

    .remember-me-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-checkbox-custom {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--accent-amber);
      background: rgba(10, 9, 28, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #0b091a;
      transition: var(--transition);
    }

    .remember-checkbox-custom.checked {
      background: var(--accent-amber);
      font-weight: 900;
    }

    .validation-message {
      font-size: 12px;
      margin-top: 6px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .validation-message.error {
      color: var(--error);
    }

    .validation-message.success {
      color: var(--success);
    }

    .login-btn-pro {
      width: 100%;
      padding: 14px;
      background: var(--grad-amber);
      border: none;
      border-radius: var(--radius-md);
      color: #0b091a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-btn-pro:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
      filter: brightness(1.05);
    }

    .btn-loading {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .btn-loading .loading-spinner {
      width: 18px;
      height: 18px;
      border-width: 2px;
      margin: 0;
      border-top-color: #000;
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 700;
      margin-top: 20px;
      text-align: center;
      display: none;
    }

    .alert.error {
      background: var(--error-bg);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      display: block;
    }

    .alert.success {
      background: var(--success-bg);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: block;
    }

    .alert.warning {
      background: var(--warning-bg);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: block;
    }

    .helper-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .helper-link {
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 700;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .helper-link:hover {
      color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .top-back-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: var(--bg-glass-heavy);
      border: 1px solid var(--border-color);
      color: var(--text-pure);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      transition: var(--transition);
    }

    .top-back-btn:hover {
      background: var(--grad-primary);
      border-color: transparent;
      color: white;
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .login-card-pro {
        padding: 30px 20px;
      }
      .top-back-btn {
        top: 10px;
        right: 10px;
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
</head>

<body class="auth-page-body">

  <a href="index.html" class="top-back-btn">
    <span>←</span>
    <span>العودة للرئيسية</span>
  </a>

  <div class="login-card-pro">
    <div class="logo-section">
      <div class="logo-icon-pro">👔</div>
      <h1 class="welcome-title">لوحة تحكم المهنيين</h1>
      <p class="welcome-subtitle">أدخل رقمك الوطني للوصول لملفك الشخصي وإدارة بياناتك</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="nationalIdInput">
          <span>🪪</span>
          <span>الرقم الوطني للمهني</span>
        </label>
        <div class="input-wrapper">
          <span class="input-icon">🪪</span>
          <input 
            type="password" 
            id="nationalIdInput" 
            class="form-input"
            placeholder="أدخل الرقم الوطني (10 أرقام)"
            maxlength="10"
            required
            inputmode="numeric"
            autocomplete="username"
          />
          <button type="button" class="password-toggle-btn" id="toggleVisibilityBtn" onclick="toggleNationalIdVisibility()" title="إظهار / إخفاء">
            <span id="eyeIcon">👁️</span>
          </button>
        </div>
        <div id="nationalIdValidation" class="validation-message">
          <span>ℹ️</span>
          <span>أدخل الرقم الوطني المسجل في طلبك</span>
        </div>
      </div>

      <!-- 🔘 زر "ذكرني" (تذكرني) -->
      <div class="remember-me-container">
        <div class="remember-me-label" onclick="toggleRememberMe()">
          <div class="remember-checkbox-custom" id="rememberCheckbox"></div>
          <span>ذكرني (حفظ بيانات الدخول)</span>
        </div>
      </div>

      <button type="submit" class="login-btn-pro" id="loginBtn">
        <span class="btn-text">🔐 دخول الحساب المهني</span>
        <span class="btn-loading">
          <div class="loading-spinner"></div>
          <span>جاري التحقق...</span>
        </span>
      </button>
    </form>

    <div id="alertMessage" class="alert"></div>

    <div class="helper-links">
      <a href="register.html" class="helper-link">
        <span>✨</span>
        <span>لست مسجلاً كمهني؟ انضم لشبكتنا الآن</span>
      </a>
      <a href="verify.html" class="helper-link">
        <span>📋</span>
        <span>تحقق من حالة طلبك والاشتراك</span>
      </a>
      <a href="customer-auth-page.html" class="helper-link" style="color: var(--accent-primary); margin-top: 5px;">
        <span>👥</span>
        <span>أنت زبون؟ سجل دخولك من بوابة العملاء</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCj5YjdiruBTCfxDnxlDd4W6YA5iCWRfE4",
      authDomain: "home-services-app-a9c5e.firebaseapp.com",
      projectId: "home-services-app-a9c5e",
      storageBucket: "home-services-app-a9c5e.appspot.com",
      messagingSenderId: "287028219636",
      appId: "1:287028219636:web:2ad4b0e092a2c007e318a1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const loginForm = document.getElementById('loginForm');
    const nationalIdInput = document.getElementById('nationalIdInput');
    const loginBtn = document.getElementById('loginBtn');
    const alertMessage = document.getElementById('alertMessage');
    const nationalIdValidation = document.getElementById('nationalIdValidation');
    const rememberCheckbox = document.getElementById('rememberCheckbox');

    let isRememberMeChecked = false;

    // Check if pro chose remember me previously
    document.addEventListener('DOMContentLoaded', () => {
      const savedProId = localStorage.getItem('rememberedNationalId');
      if (savedProId) {
        nationalIdInput.value = savedProId;
        isRememberMeChecked = true;
        rememberCheckbox.classList.add('checked');
        rememberCheckbox.textContent = '✓';
        validateInput();
      }
    });

    window.toggleRememberMe = function() {
      isRememberMeChecked = !isRememberMeChecked;
      if (isRememberMeChecked) {
        rememberCheckbox.classList.add('checked');
        rememberCheckbox.textContent = '✓';
      } else {
        rememberCheckbox.classList.remove('checked');
        rememberCheckbox.textContent = '';
        localStorage.removeItem('rememberedNationalId');
      }
    };

    window.toggleNationalIdVisibility = function() {
      const eyeIcon = document.getElementById('eyeIcon');
      if (nationalIdInput.type === 'password') {
        nationalIdInput.type = 'text';
        eyeIcon.textContent = '🙈';
      } else {
        nationalIdInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    };

    nationalIdInput.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
      }
      validateInput();
    });

    function validateInput() {
      const nationalId = nationalIdInput.value.trim();
      const validationEl = nationalIdValidation;

      if (nationalId.length === 0) {
        validationEl.className = 'validation-message';
        validationEl.innerHTML = '<span>ℹ️</span> <span>أدخل الرقم الوطني المسجل في طلبك</span>';
        return false;
      } else if (nationalId.length < 10) {
        validationEl.className = 'validation-message error';
        validationEl.innerHTML = `<span>⚠️</span> <span>يجب إدخال 10 أرقام (المكتوب الآن: ${nationalId.length})</span>`;
        return false;
      } else {
        validationEl.className = 'validation-message success';
        validationEl.innerHTML = '<span>✅</span> <span>الرقم الوطني مكتمل</span>';
        return true;
      }
    }

    function showAlert(message, type = 'error') {
      alertMessage.className = `alert ${type}`;
      alertMessage.textContent = message;
      alertMessage.style.display = 'block';

      if (type !== 'error') {
        setTimeout(() => {
          alertMessage.style.display = 'none';
        }, 5000);
      }
    }

    function hideAlert() {
      alertMessage.style.display = 'none';
    }

    function showLoading() {
      loginBtn.disabled = true;
      loginBtn.querySelector('.btn-text').style.display = 'none';
      loginBtn.querySelector('.btn-loading').style.display = 'flex';
    }

    function hideLoading() {
      loginBtn.disabled = false;
      loginBtn.querySelector('.btn-text').style.display = 'flex';
      loginBtn.querySelector('.btn-loading').style.display = 'none';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const nationalId = nationalIdInput.value.trim();

      if (!nationalId || nationalId.length !== 10) {
        showAlert('يرجى إدخال الرقم الوطني المكون من 10 أرقام.');
        nationalIdInput.focus();
        return;
      }

      showLoading();

      try {
        const userRef = doc(db, "approvedUsers", nationalId);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const userData = userSnap.data();

          if (isRememberMeChecked) {
            localStorage.setItem('rememberedNationalId', nationalId);
          } else {
            localStorage.removeItem('rememberedNationalId');
          }

          localStorage.setItem("loggedNationalId", nationalId);
          localStorage.setItem("userLoginTime", new Date().toISOString());
          
          showAlert(`🎉 مرحباً ${userData.name}! جاري نقلك لملفك الشخصي...`, 'success');

          setTimeout(() => {
            window.location.href = "profile.html";
          }, 1200);

        } else {
          const pendingRef = doc(db, "pendingUsers", nationalId);
          const pendingSnap = await getDoc(pendingRef);

          if (pendingSnap.exists()) {
            showAlert('⏳ طلبك قيد المراجعة والتدقيق من قبل الإدارة، يرجى الانتظار.', 'warning');
          } else {
            const rejectedRef = doc(db, "rejectedUsers", nationalId);
            const rejectedSnap = await getDoc(rejectedRef);

            if (rejectedSnap.exists()) {
              const rejectedData = rejectedSnap.data();
              showAlert(`❌ تم رفض الطلب. السبب: ${rejectedData.reason || 'يرجى مراجعة الإدارة'}`, 'error');
            } else {
              showAlert('⚠️ الرقم الوطني غير مسجل لدينا. يمكنك التسجيل كمهني جديد الآن.', 'error');
            }
          }
        }

      } catch (error) {
        console.error("Login error:", error);
        showAlert('حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.', 'error');
      } finally {
        hideLoading();
      }
    });

    nationalIdInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loginForm.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
