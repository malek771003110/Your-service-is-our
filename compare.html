<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارنة المهنيين ⚖️ | منصة خدمتك 🇯🇴</title>
    
    <!-- Fonts & Core Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .compare-page-layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 15px 60px;
        }

        .compare-header-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: var(--shadow-glass);
            position: relative;
        }

        .compare-icon-bubble {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--grad-amber);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #0b091a;
            margin: 0 auto 12px;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        }

        .compare-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-pure);
            margin-bottom: 6px;
        }

        .compare-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            align-items: stretch;
        }

        .compare-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 25px;
            box-shadow: var(--shadow-card);
            position: relative;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .compare-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-amber);
            box-shadow: var(--shadow-glass);
        }

        .btn-remove-compare {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-remove-compare:hover {
            background: rgba(244, 63, 94, 0.2);
            color: #fb7185;
            border-color: rgba(244, 63, 94, 0.4);
        }

        .compare-avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--grad-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            margin: 0 auto 12px;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .compare-pro-name {
            font-size: 19px;
            font-weight: 900;
            color: var(--text-pure);
            text-align: center;
            margin-bottom: 4px;
        }

        .compare-pro-job {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 20px;
        }

        .compare-attributes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .compare-attr-row {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .compare-attr-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .compare-attr-value {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-pure);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-best {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            font-size: 10.5px;
            font-weight: 900;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }

        .compare-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-compare-contact {
            padding: 12px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-compare-contact.phone {
            background: var(--grad-emerald);
            color: #0b091a;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-compare-contact.whatsapp {
            background: rgba(37, 211, 102, 0.2);
            color: #4ade80;
            border: 1px solid rgba(37, 211, 102, 0.4);
        }

        .btn-compare-contact:hover {
            transform: translateY(-2px);
        }

        .empty-compare-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 60px 20px;
            text-align: center;
            grid-column: 1 / -1;
            box-shadow: var(--shadow-glass);
        }

        .top-back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--bg-glass-heavy);
            border: 1px solid var(--border-color);
            color: var(--text-pure);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .top-back-btn:hover {
            background: var(--grad-primary);
            border-color: transparent;
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .compare-grid {
                grid-template-columns: 1fr;
            }
            .compare-actions-grid {
                grid-template-columns: 1fr;
            }
            .top-back-btn {
                top: 10px;
                right: 10px;
                font-size: 12px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="top-back-btn">
        <span>←</span>
        <span>العودة للرئيسية</span>
    </a>

    <div class="compare-page-layout">
        <div class="compare-header-card">
            <div class="compare-icon-bubble">⚖️</div>
            <h1 class="compare-title">مقارنة المهنيين</h1>
            <p class="compare-subtitle">قارن بين الأسعار وسنوات الخبرة والتقييمات لاختيار المهني الأنسب لاحتياجاتك</p>
        </div>

        <div class="compare-grid" id="comparisonGrid"></div>

        <div class="empty-compare-card" id="emptyState" style="display: none;">
            <div style="font-size: 50px; margin-bottom: 12px;">⚖️</div>
            <h2 style="color: var(--text-pure); font-size: 20px; font-weight: 900; margin-bottom: 8px;">لا يوجد مهنيين في قائمة المقارنة</h2>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 25px;">
                قم بإضافة مهنيين (حتى 3 مهنيين) من الصفحة الرئيسية للمقارنة بينهم جنباً إلى جنب.
            </p>
            <a href="index.html" class="btn-nav-register" style="display: inline-flex; padding: 12px 30px; font-size: 14px;">
                🔍 تصفح دليل المهنيين
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadComparison();
        });

        function loadComparison() {
            const grid = document.getElementById('comparisonGrid');
            const emptyState = document.getElementById('emptyState');
            const compareList = JSON.parse(localStorage.getItem('compareList')) || [];

            if (compareList.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            const bestRating = Math.max(...compareList.map(p => p.ratings?.averageRating || 0));
            const bestPrice = Math.min(...compareList.map(p => p.hourlyPrice || Infinity).filter(p => p !== Infinity));
            const bestExperience = Math.max(...compareList.map(p => parseInt(p.experienceYears) || 0));

            compareList.forEach(prof => {
                const card = createProCard(prof, { bestRating, bestPrice, bestExperience });
                grid.appendChild(card);
            });
        }

        function createProCard(prof, best) {
            const card = document.createElement('div');
            card.className = 'compare-card';

            const rating = prof.ratings?.averageRating || 0;
            const price = prof.hourlyPrice || 0;
            const exp = parseInt(prof.experienceYears) || 0;
            const phone = prof.phone || '';
            const cleanPhone = phone.replace(/[^0-9]/g, '');

            const isBestRating = rating > 0 && rating === best.bestRating;
            const isBestPrice = price > 0 && price === best.bestPrice;
            const isBestExp = exp > 0 && exp === best.bestExperience;

            card.innerHTML = `
                <div>
                    <button class="btn-remove-compare" onclick="removeFromCompare('${prof.id}')" title="إزالة من المقارنة">✕</button>
                    
                    <div class="compare-avatar-circle">${prof.name.charAt(0).toUpperCase()}</div>
                    <h3 class="compare-pro-name">${prof.name}</h3>
                    <div class="compare-pro-job">${prof.job}</div>

                    <div class="compare-attributes-list">
                        <div class="compare-attr-row">
                            <span class="compare-attr-label">📍 المحافظة</span>
                            <span class="compare-attr-value">${prof.city || 'عمان'}</span>
                        </div>

                        <div class="compare-attr-row">
                            <span class="compare-attr-label">⭐ التقييم العام</span>
                            <span class="compare-attr-value">
                                <span>⭐ ${rating > 0 ? rating.toFixed(1) : '5.0'}</span>
                                ${isBestRating ? '<span class="badge-best">الأعلى ⭐</span>' : ''}
                            </span>
                        </div>

                        <div class="compare-attr-row">
                            <span class="compare-attr-label">💰 سعر الساعة</span>
                            <span class="compare-attr-value">
                                <span>${price > 0 ? price + ' د.أ' : 'حسب الاتفاق'}</span>
                                ${isBestPrice ? '<span class="badge-best">الأفضل سعراً 💰</span>' : ''}
                            </span>
                        </div>

                        <div class="compare-attr-row">
                            <span class="compare-attr-label">⏳ سنوات الخبرة</span>
                            <span class="compare-attr-value">
                                <span>${exp > 0 ? exp + ' سنوات' : 'متمرس'}</span>
                                ${isBestExp ? '<span class="badge-best">الأكثر خبرة 🎖️</span>' : ''}
                            </span>
                        </div>

                        <div class="compare-attr-row">
                            <span class="compare-attr-label">⏰ ساعات العمل</span>
                            <span class="compare-attr-value">${(prof.workStartTime && prof.workEndTime) ? prof.workStartTime + ' - ' + prof.workEndTime : 'طوال اليوم'}</span>
                        </div>
                    </div>
                </div>

                <div class="compare-actions-grid">
                    ${phone ? `
                        <a href="tel:${cleanPhone}" class="btn-compare-contact phone">
                            📞 اتصال
                        </a>
                        <a href="https://wa.me/962${cleanPhone.startsWith('0') ? cleanPhone.slice(1) : cleanPhone}" target="_blank" class="btn-compare-contact whatsapp">
                            💬 واتساب
                        </a>
                    ` : `
                        <a href="index.html" class="btn-compare-contact phone" style="grid-column: span 2;">
                            🌐 عرض الملف
                        </a>
                    `}
                </div>
            `;

            return card;
        }

        window.removeFromCompare = function(id) {
            let list = JSON.parse(localStorage.getItem('compareList')) || [];
            list = list.filter(p => p.id !== id);
            localStorage.setItem('compareList', JSON.stringify(list));
            loadComparison();
        };
    </script>
</body>
</html>
