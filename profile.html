<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الملف الشخصي للمهني | منصة خدمتك 🇯🇴</title>
  <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png">
  <link rel="shortcut icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png">
  <meta property="og:image" content="https://khedmtek.netlify.app/images/logo.png">
  
  <!-- Fonts & Core Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/theme.js"></script>

  <style>
    .profile-dashboard-layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 15px 60px;
    }

    /* Top Nav */
    .pro-navbar {
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      box-shadow: var(--shadow-glass);
    }

    .pro-nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pro-nav-brand h1 {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-pure);
    }

    .pro-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-pro-nav {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-pure);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .btn-pro-nav:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .btn-pro-nav.logout {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.3);
      color: #fb7185;
    }

    .btn-pro-nav.logout:hover {
      background: rgba(244, 63, 94, 0.3);
    }

    /* Grid Layout */
    .pro-dashboard-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 25px;
      align-items: start;
    }

    /* Left Sidebar: Profile Summary Card */
    .pro-summary-card {
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 30px 22px;
      text-align: center;
      box-shadow: var(--shadow-glass);
      position: sticky;
      top: 20px;
    }

    .pro-avatar-bubble {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: white;
      margin: 0 auto 16px;
      box-shadow: 0 4px 25px rgba(245, 158, 11, 0.4);
      position: relative;
    }

    .pro-status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-emerald);
      border: 3px solid #0b091a;
      box-shadow: 0 0 10px var(--accent-emerald);
    }

    .pro-status-dot.busy {
      background: var(--accent-rose);
      box-shadow: 0 0 10px var(--accent-rose);
    }

    .pro-name-display {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-pure);
      margin-bottom: 4px;
    }

    .pro-job-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      color: #fbbf24;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* Availability Toggle Box */
    .availability-toggle-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .avail-text {
      text-align: right;
    }

    .avail-text h4 {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-pure);
      margin-bottom: 2px;
    }

    .avail-text span {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .switch-toggle-custom {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .switch-toggle-custom input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle-round {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(244, 63, 94, 0.3);
      border: 1px solid rgba(244, 63, 94, 0.5);
      transition: .4s;
      border-radius: 34px;
    }

    .slider-toggle-round:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle-round {
      background-color: #10b981;
      border-color: #10b981;
    }

    input:checked + .slider-toggle-round:before {
      transform: translateX(22px);
    }

    /* Stats summary */
    .pro-metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .metric-single-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .metric-number {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-pure);
    }

    .metric-label {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Right Column: Edit Details Form */
    .pro-edit-card {
      background: var(--bg-card);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 35px 30px;
      box-shadow: var(--shadow-glass);
    }

    .edit-card-heading {
      font-size: 19px;
      font-weight: 900;
      color: var(--text-pure);
      margin-bottom: 22px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pro-form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(10, 9, 28, 0.7);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-pure);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: var(--transition);
    }

    .pro-form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--cyan-glow);
    }

    .pro-form-input.readonly-lock {
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-muted);
      cursor: not-allowed;
      border-style: dashed;
    }

    .time-grid-picker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-grid-picker > div {
      flex: 1;
    }

    .btn-save-pro {
      width: 100%;
      padding: 14px;
      background: var(--grad-primary);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-save-pro:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
    }

    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      display: none;
    }

    .alert.error {
      background: var(--error-bg);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      display: block;
    }

    .alert.success {
      background: var(--success-bg);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: block;
    }

    .alert.info {
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: block;
    }

    @media (max-width: 860px) {
      .pro-dashboard-grid {
        grid-template-columns: 1fr;
      }
      .pro-summary-card {
        position: relative;
        top: 0;
      }
      .form-grid-2col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="profile-dashboard-layout">
    
    <!-- Top Navigation -->
    <header class="pro-navbar">
      <div class="pro-nav-brand">
        <div style="font-size: 24px;">🛠️</div>
        <h1>لوحة تحكم المهني</h1>
      </div>

      <div class="pro-nav-actions">
        <button class="theme-switch-btn" onclick="toggleTheme()" title="تبديل المظهر">☀️</button>
        <a href="index.html" class="btn-pro-nav">
          <span>🏠</span>
          <span>الرئيسية</span>
        </a>
        <button class="btn-pro-nav logout" onclick="logout()">
          <span>🚪</span>
          <span>تسجيل خروج</span>
        </button>
      </div>
    </header>

    <!-- Main Grid -->
    <div class="pro-dashboard-grid">
      
      <!-- Left: Profile Summary -->
      <aside class="pro-summary-card">
        <div class="pro-avatar-bubble" id="profileAvatar">
          <span>👔</span>
          <div class="pro-status-dot" id="avatarStatusDot"></div>
        </div>

        <h2 class="pro-name-display" id="profileName">جارِ التحميل...</h2>
        <span class="pro-job-badge" id="profileJob">مهني</span>

        <!-- Availability Toggle -->
        <div class="availability-toggle-box">
          <div class="avail-text">
            <h4>الحالة للزبائن</h4>
            <span id="statusText">متاح للعمل 🟢</span>
          </div>
          <label class="switch-toggle-custom">
            <input type="checkbox" id="statusToggle" checked>
            <span class="slider-toggle-round"></span>
          </label>
        </div>

        <div class="pro-metrics-grid">
          <div class="metric-single-box">
            <div class="metric-number" id="memberSince">1</div>
            <div class="metric-label">أيام العضوية</div>
          </div>
          <div class="metric-single-box">
            <div class="metric-number" id="profileViews">48</div>
            <div class="metric-label">مشاهدات الملف</div>
          </div>
        </div>

        <a href="index.html" class="btn-pro-nav" style="justify-content: center; width: 100%; padding: 10px;">
          <span>🌐</span>
          <span>معاينة ملفك على الموقع العام</span>
        </a>
      </aside>

      <!-- Right: Edit Details Form -->
      <main class="pro-edit-card">
        <div id="alertMessage" class="alert"></div>

        <div class="edit-card-heading">
          <span>✏️</span>
          <span>تعديل وتحديث بياناتك المهنية</span>
        </div>

        <form id="profileForm">
          <div class="form-grid-2col">
            <div class="form-group">
              <label for="nameInput">الاسم الكامل (مسجل)</label>
              <input type="text" id="nameInput" class="pro-form-input readonly-lock" readonly title="لا يمكن تغيير الاسم من هنا">
            </div>

            <div class="form-group">
              <label for="nationalIdInput">الرقم الوطني (مسجل)</label>
              <input type="text" id="nationalIdInput" class="pro-form-input readonly-lock" readonly title="الرقم الوطني ثابت">
            </div>
          </div>

          <div class="form-grid-2col">
            <div class="form-group">
              <label for="phoneInput">رقم الهاتف (الواتساب) *</label>
              <input type="tel" id="phoneInput" class="pro-form-input" required pattern="07[0-9]{8}" maxlength="10" placeholder="07XXXXXXXX">
            </div>

            <div class="form-group">
              <label for="emailInput">البريد الإلكتروني *</label>
              <input type="email" id="emailInput" class="pro-form-input" required placeholder="example@email.com">
            </div>
          </div>

          <div class="form-grid-2col">
            <div class="form-group">
              <label for="jobInput">المسمى المهني والتخصص *</label>
              <input type="text" id="jobInput" class="pro-form-input" required placeholder="مثال: نجار موبيليا، كهربائي منازل">
            </div>

            <div class="form-group">
              <label for="cityInput">المحافظة الأساسية *</label>
              <select id="cityInput" class="pro-form-input" required>
                <option value="عمان">عمان</option>
                <option value="الزرقاء">الزرقاء</option>
                <option value="إربد">إربد</option>
                <option value="البلقاء">البلقاء</option>
                <option value="المفرق">المفرق</option>
                <option value="الكرك">الكرك</option>
                <option value="معان">معان</option>
                <option value="الطفيلة">الطفيلة</option>
                <option value="العقبة">العقبة</option>
                <option value="السلط">السلط</option>
                <option value="مادبا">مادبا</option>
                <option value="عجلون">عجلون</option>
                <option value="جرش">جرش</option>
              </select>
            </div>
          </div>

          <div class="form-grid-2col">
            <div class="form-group">
              <label for="priceInput">سعر الساعة المبدئي (دينار أردني) *</label>
              <input type="number" id="priceInput" class="pro-form-input" min="1" max="1000" required placeholder="15">
            </div>

            <div class="form-group">
              <label for="experienceInput">سنوات الخبرة (بالأرقام) *</label>
              <input type="number" id="experienceInput" class="pro-form-input" min="0" max="50" required placeholder="5">
            </div>
          </div>

          <div class="form-group">
            <label>ساعات وأوقات العمل المفضلة</label>
            <div class="time-grid-picker">
              <div>
                <span style="font-size: 12px; color: var(--text-muted);">من:</span>
                <input type="time" id="workStartTime" class="pro-form-input" value="08:00">
              </div>
              <div>
                <span style="font-size: 12px; color: var(--text-muted);">إلى:</span>
                <input type="time" id="workEndTime" class="pro-form-input" value="18:00">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="bioInput">نبذة تعريفية ووصف الخدمات للعملاء</label>
            <textarea id="bioInput" class="pro-form-input" rows="4" maxlength="500" placeholder="اكتب نبذة عن مهاراتك وسرعة استجابتك والضمانات التي تقدمها للزبائن..."></textarea>
          </div>

          <button type="submit" class="btn-save-pro" id="saveBtn">
            <span class="btn-text">💾 حفظ التعديلات والبيانات</span>
            <span class="btn-loading" style="display: none;">
              <div class="loading-spinner" style="width: 18px; height: 18px;"></div>
              <span>جاري الحفظ...</span>
            </span>
          </button>
        </form>
      </main>

    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      updateDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCj5YjdiruBTCfxDnxlDd4W6YA5iCWRfE4",
      authDomain: "home-services-app-a9c5e.firebaseapp.com",
      projectId: "home-services-app-a9c5e",
      storageBucket: "home-services-app-a9c5e.appspot.com",
      messagingSenderId: "287028219636",
      appId: "1:287028219636:web:2ad4b0e092a2c007e318a1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const nationalId = localStorage.getItem('loggedNationalId');
    if (!nationalId) {
      window.location.href = 'login.html';
    }

    let currentUserData = null;

    // DOM references
    const elements = {
      profileName: document.getElementById('profileName'),
      profileJob: document.getElementById('profileJob'),
      avatarStatusDot: document.getElementById('avatarStatusDot'),
      statusToggle: document.getElementById('statusToggle'),
      statusText: document.getElementById('statusText'),
      memberSince: document.getElementById('memberSince'),
      profileViews: document.getElementById('profileViews'),
      nameInput: document.getElementById('nameInput'),
      nationalIdInput: document.getElementById('nationalIdInput'),
      phoneInput: document.getElementById('phoneInput'),
      emailInput: document.getElementById('emailInput'),
      jobInput: document.getElementById('jobInput'),
      cityInput: document.getElementById('cityInput'),
      priceInput: document.getElementById('priceInput'),
      experienceInput: document.getElementById('experienceInput'),
      workStartTime: document.getElementById('workStartTime'),
      workEndTime: document.getElementById('workEndTime'),
      bioInput: document.getElementById('bioInput'),
      saveBtn: document.getElementById('saveBtn'),
      alertMessage: document.getElementById('alertMessage'),
      profileForm: document.getElementById('profileForm')
    };

    document.addEventListener('DOMContentLoaded', async () => {
      await loadProfile();
      setupStatusToggle();
      setupFormSubmit();
    });

    async function loadProfile() {
      try {
        const docRef = doc(db, "approvedUsers", nationalId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          currentUserData = docSnap.data();
          populateData(currentUserData);
        } else {
          showAlert("لم يتم العثور على الحساب. يرجى تسجيل الدخول مجدداً.", "error");
          setTimeout(() => logout(), 2000);
        }
      } catch (err) {
        console.error("Error loading profile:", err);
        showAlert("حدث خطأ أثناء تحميل البيانات.", "error");
      }
    }

    function populateData(data) {
      elements.profileName.textContent = data.name || 'مهني';
      elements.profileJob.textContent = data.job || 'مهني';
      elements.nameInput.value = data.name || '';
      elements.nationalIdInput.value = data.nationalId || nationalId;
      elements.phoneInput.value = data.phone || '';
      elements.emailInput.value = data.email || '';
      elements.jobInput.value = data.job || '';
      elements.cityInput.value = data.city || 'عمان';
      elements.priceInput.value = data.hourlyPrice || '';
      elements.experienceInput.value = typeof data.experienceYears === 'number' ? data.experienceYears : parseInt(data.experienceYears) || 3;
      elements.workStartTime.value = data.workStartTime || '08:00';
      elements.workEndTime.value = data.workEndTime || '18:00';
      elements.bioInput.value = data.bio || data.description || '';

      // Status
      const isAvailable = data.status !== 'busy';
      elements.statusToggle.checked = isAvailable;
      updateStatusUI(isAvailable);

      // Membership days
      if (data.createdAt) {
        let createdDate = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
        const diffDays = Math.max(1, Math.floor((new Date() - createdDate) / (1000 * 60 * 60 * 24)));
        elements.memberSince.textContent = diffDays;
      }
    }

    function setupStatusToggle() {
      elements.statusToggle.addEventListener('change', async function() {
        const isAvailable = this.checked;
        const newStatus = isAvailable ? 'available' : 'busy';
        updateStatusUI(isAvailable);

        try {
          const docRef = doc(db, "approvedUsers", nationalId);
          await updateDoc(docRef, {
            status: newStatus,
            lastUpdated: serverTimestamp()
          });
          showAlert(isAvailable ? "أنت الآن متاح للعملاء 🟢" : "تم ضبط حالتك على مشغول 🔴", "success");
          setTimeout(hideAlert, 3000);
        } catch (err) {
          console.error("Status update error:", err);
          showAlert("فشل تحديث الحالة في الخادم.", "error");
        }
      });
    }

    function updateStatusUI(isAvailable) {
      if (isAvailable) {
        elements.statusText.textContent = "متاح للعمل 🟢";
        elements.statusText.style.color = "#34d399";
        elements.avatarStatusDot.classList.remove('busy');
      } else {
        elements.statusText.textContent = "مشغول حالياً 🔴";
        elements.statusText.style.color = "#fb7185";
        elements.avatarStatusDot.classList.add('busy');
      }
    }

    function setupFormSubmit() {
      elements.profileForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const phone = elements.phoneInput.value.trim();
        const email = elements.emailInput.value.trim();
        const job = elements.jobInput.value.trim();
        const city = elements.cityInput.value;
        const price = parseFloat(elements.priceInput.value);
        const exp = parseInt(elements.experienceInput.value);

        if (!phone || !email || !job || !city) {
          showAlert("يرجى ملء جميع الحقول المطلوبة.", "error");
          return;
        }

        elements.saveBtn.disabled = true;
        elements.saveBtn.querySelector('.btn-text').style.display = 'none';
        elements.saveBtn.querySelector('.btn-loading').style.display = 'flex';

        try {
          const docRef = doc(db, "approvedUsers", nationalId);
          const updatePayload = {
            phone: phone,
            email: email,
            job: job,
            city: city,
            hourlyPrice: isNaN(price) ? 15 : price,
            experienceYears: isNaN(exp) ? 3 : exp,
            workStartTime: elements.workStartTime.value,
            workEndTime: elements.workEndTime.value,
            bio: elements.bioInput.value.trim(),
            lastUpdated: serverTimestamp()
          };

          await updateDoc(docRef, updatePayload);

          elements.profileJob.textContent = job;
          showAlert("🎉 تم حفظ وتحديث بياناتك بنجاح!", "success");
          setTimeout(hideAlert, 4000);

        } catch (err) {
          console.error("Save error:", err);
          showAlert("حدث خطأ أثناء حفظ التعديلات.", "error");
        } finally {
          elements.saveBtn.disabled = false;
          elements.saveBtn.querySelector('.btn-text').style.display = 'flex';
          elements.saveBtn.querySelector('.btn-loading').style.display = 'none';
        }
      });
    }

    function showAlert(msg, type) {
      elements.alertMessage.textContent = msg;
      elements.alertMessage.className = `alert ${type}`;
      elements.alertMessage.style.display = 'block';
    }

    function hideAlert() {
      elements.alertMessage.style.display = 'none';
    }

    window.logout = function() {
      if (confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem('loggedNationalId');
        localStorage.removeItem('userLoginTime');
        window.location.href = 'login.html';
      }
    };
  </script>
</body>
</html>
